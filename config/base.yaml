use_calib: True
# used_dataset: "datasets/tum/rgbd_dataset_freiburg1_desk" # datasets/replica/office2
# used_dataset: "datasets/replica/office2" # datasets/tum/rgbd_dataset_freiburg1_desk
# used_dataset: "datasets/replica/office1"
# used_dataset: "datasets/replica/office3"
used_dataset: "datasets/replica/room0"

# stop_at_frame: 240
stop_at_keyframe: 10
gaussians:
  init_lr: 0.05
  num_iterations: 30
  window_size: 4 # 2 newest frames are subtracted -> window_size = 2 newest frames + N random frames
  tracking_itr_num: 100
  c_conf_threshold: 1.5
  Calibration:
    tum:
      width: 512 #640
      height: 384 #480
    replica:
      width: 512
      height: 288
    #   fx: 458.81054811 # 458.5710854 #413.8451264 # 517.3      # 573.51318513 # 413.8451264 # 517.306408
    #   fy: 458.10100154 # 457.86190916 # 413.175372  # 516.5      # 572.62625193 # 413.175372 # 516.469215
    #   cx: 255.6 #254.914432   # 319.5      # 254.914432   # 318.643040  
    #   cy: 191.6 #204.2511912  # 239.5      # 204.2511912  # 255.313989  
    #   # k1: 0.262383   # 0.2099064   # 0.262383 * 0.8 [512/640]  
    #   # k2: -0.953104  #-0.7624832   #-0.953104 * 0.8 [512/640] 
    #   # p1: -0.005358  #-0.0042864   #-0.005358 * 0.8 [512/640] 
    #   # p2: 0.002628   # 0.002102400 # 0.002628 * 0.8 [512/640] 
    #   # k3: 1.163314   # 0.001681920 # 1.163314 * 0.8 [512/640] 
    #   width: 512 #640
    #   height: 384 #480
    # replica:
    #   fx: 256 # 600.0/2.34375
    #   fy: 256 # 600.0/2.34375
    #   cx: 255.786666667 # 599.5/2.34375
    #   cy: 144.853333333 # 339.5/2.34375
    #   k1: 0.0
    #   k2: 0.0
    #   p1: 0.0
    #   p2: 0.0
    #   k3: 0.0
    #   width: 512
    #   height: 288
    #   depth_scale: 5000.0
  pipeline_params:
    convert_SHs_python: False
    compute_cov3D_python: False
  tracking_lr:
    cam_rot_delta: 0.003
    cam_trans_delta: 0.001
  rgb_boundary_threshold: 0.01
  edge_threshold: 1.1
  rgb_boundary_threshold: 0.01
  map_optimisation_params:
    iterations: 30000
    position_lr_init: 0.0016
    position_lr_final: 0.0000016
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 30000
    feature_lr: 0.0025
    opacity_lr: 0.05
    scaling_lr: 0.001
    rotation_lr: 0.001
    percent_dense: 0.01
    lambda_dssim: 0.2
    densification_interval: 100
    opacity_reset_interval: 3000
    densify_from_iter: 500
    densify_until_iter: 15000
    densify_grad_threshold: 0.0002

single_thread: False

dataset:
  subsample: 1
  img_downsample: 1
  center_principle_point: True

matching:
  max_iter: 10
  lambda_init: 1e-8
  convergence_thresh: 1e-6
  dist_thresh: 1e-1 # distance in 3D space
  radius: 3
  dilation_max: 5 # Right now starts from max and iteratively decreases until 1

tracking:
  min_match_frac: 0.05
  max_iters: 50
  C_conf: 0.0
  Q_conf: 1.5
  rel_error: 1e-3
  delta_norm: 1e-3
  huber: 1.345
  match_frac_thresh: 0.333
  sigma_ray: 0.003
  sigma_dist: 1e+1
  sigma_pixel: 1.0
  sigma_depth: 1e+1 # NOTE: log-depth!
  sigma_point: 0.05
  pixel_border: -10 # Only in calib (negative means allow pixels outside image up to that distance)
  depth_eps: 1e-6 # Only in calib case
  filtering_mode: weighted_pointmap # recent, first, best_score, weighted_pointmap, weighted_spherical, indep_conf
  filtering_score: median # median, mean (only used for filtering_mode=best_score)

local_opt:
  pin: 1
  window_size: 1e+6   
  C_conf: 0.0
  Q_conf: 1.5
  min_match_frac: 0.1
  pixel_border: -10 # Only in calib (negative means allow pixels outside image up to that distance)
  depth_eps: 1e-6 # Only in calib case
  max_iters: 10
  sigma_ray: 0.003
  sigma_dist: 1e+1
  sigma_pixel: 1.0
  sigma_depth: 1e+1 # NOTE: log-depth!
  sigma_point: 0.05
  delta_norm: 1e-8
  use_cuda: True

retrieval:
  k: 3
  min_thresh: 5e-3

reloc:
  min_match_frac: 0.3
  strict: True